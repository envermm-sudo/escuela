{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion · Panel del Personal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">

  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-indigo-600 text-white text-2xl font-bold mb-3">PE</div>
    <h1 class="text-2xl font-bold text-gray-900">Panel del Personal</h1>
    <p class="text-sm text-gray-600 mt-1">Acceso para docentes, preceptores y directivos</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-800 border border-red-200 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electronico</label>
        <input type="text" name="email" required autofocus autocomplete="username"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
               placeholder="Email o usuario">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contrasena</label>
        <input type="password" name="password" required
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
               placeholder="••••••••">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
        Entrar
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="{% url 'comunicacion:recuperar_clave_solicitar' %}"
         class="text-sm text-slate-600 hover:text-slate-900 underline underline-offset-2">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <div class="mt-5 pt-5 border-t border-gray-200 text-center">
      <a href="/" class="text-sm text-gray-500 hover:text-gray-700">← Volver al portal</a>
    </div>
  </div>

  <p class="text-center text-xs text-gray-400 mt-6">Creado por Tecnosoft</p>
</div>

</body>
</html>
