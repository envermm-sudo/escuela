{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-10">
    <div class="bg-white shadow-md rounded-2xl p-6 sm:p-8 border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Iniciar sesión</h1>
            <p class="text-sm text-gray-600 mt-2">Accede para gestionar tus grados y notificaciones.</p>
        </div>

        {% if error %}
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="{% url 'comunicacion:login_padre' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input type="email" name="email" id="id_email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="tucorreo@ejemplo.com">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Tu contraseña">
            </div>
            <button type="submit" class="w-full inline-flex items-center justify-center px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 transition">
                Entrar
            </button>
        </form>

        <div class="text-center mt-4 space-y-2">
          <p class="text-sm text-gray-600">
            ¿No tenés cuenta?
            <a href="{% url 'comunicacion:registro_padre' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Registrate</a>
          </p>
          <p class="text-sm">
            <a href="{% url 'comunicacion:recuperar_clave_solicitar' %}" class="text-slate-600 hover:text-slate-900 underline underline-offset-2">
              ¿Olvidaste tu contraseña?
            </a>
          </p>
        </div>
    </div>
</section>
{% endblock %}
